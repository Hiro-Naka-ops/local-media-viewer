name: Build macOS app

# Run by hand from the Actions tab ("Run workflow"); a build is only needed
# when a new Mac copy is wanted, not on every push.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple silicon (M1 and later)
            arch: arm64
          - runner: macos-15-intel  # Intel Macs
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test
        # Reported, not blocking: a few tests pin Windows behaviour (Explorer's
        # name order, real window frames) that a headless Mac runner differs on.
        continue-on-error: true
        run: |
          python -m pip install "Pillow==12.1.1" "pillow-heif==1.8.0" "PySide6==6.10.2" "pytest==9.0.2"
          QT_QPA_PLATFORM=offscreen python -m pytest -q \
            --deselect tests/test_viewer_controls.py::test_video_timeline_overlay_shows_and_fades

      - name: Build
        run: sh scripts/build_mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Local-Media-Viewer-macOS-${{ matrix.arch }}
          path: dist/Local-Media-Viewer-macOS-${{ matrix.arch }}.zip
          # Already a zip; storing it as-is avoids a pointless second compression.
          compression-level: 0
