[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "local-media-viewer"
version = "0.1.0"
description = "Standalone Windows image and video viewer."
requires-python = ">=3.11,<3.14"
dependencies = ["Pillow==12.1.1", "PySide6==6.10.2"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.4", "pyinstaller==6.19.0"]

[project.scripts]
local-media-viewer = "local_media_viewer.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_media_viewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
