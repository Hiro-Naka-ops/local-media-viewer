[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "local-media-viewer"
version = "1.2.0"
description = "Standalone Windows image and video viewer."
requires-python = ">=3.11,<3.15"
dependencies = [
    "Pillow==12.1.1",
    "pillow-heif==1.8.0",
    "PySide6==6.10.2",
    # The OCR built into Windows (ocr.py). Keep in step with
    # scripts/requirements-windows.txt.
    "winrt-runtime==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Globalization==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams==3.2.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.4", "pyinstaller==6.19.0"]

[project.scripts]
local-media-viewer = "local_media_viewer.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_media_viewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
